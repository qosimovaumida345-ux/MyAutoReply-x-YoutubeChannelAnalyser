name: CreatorFlow Background Worker

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task Type (download, uniqualize, clip)'
        required: true
        default: 'download'
      url:
        description: 'Target Video URL'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      format:
        description: 'Format or Quality (720, 1080, mp3, etc.)'
        required: false
        default: '720'
      caption:
        description: 'Caption for video'
        required: false
        default: ''
      proxy:
        description: 'Proxy URL if needed'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      cookies_text:
        description: 'YouTube Cookies content'
        required: false
        default: ''

jobs:
  process-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Mask Sensitive Tokens
        run: |
          if [ -n "${{ github.event.inputs.bot_token }}" ]; then
            echo "::add-mask::${{ github.event.inputs.bot_token }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Deno (Official JS runtime for yt-dlp challenge solving)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO Token Provider (Automated YouTube POT Generator)
        run: |
          docker run --name pot-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4416/ping > /dev/null 2>&1 || curl -s http://127.0.0.1:4416/ > /dev/null 2>&1; then
              echo "PO Token Provider is ready on port 4416!"
              break
            fi
            sleep 1
          done

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp yt-dlp-ejs httpx bgutil-ytdlp-pot-provider

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Run Action Worker
        env:
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          TARGET_URL: ${{ github.event.inputs.url }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          FORMAT: ${{ github.event.inputs.format }}
          CAPTION: ${{ github.event.inputs.caption }}
          PROXY: ${{ github.event.inputs.proxy }}
          BOT_TOKEN: ${{ github.event.inputs.bot_token || secrets.BOT_TOKEN }}
          COOKIES_TEXT: ${{ github.event.inputs.cookies_text || secrets.YOUTUBE_COOKIE || secrets.YOUTUBE_COOKIES || secrets.COOKIES || secrets.COOKIE }}
        run: |
          python action_worker.py
