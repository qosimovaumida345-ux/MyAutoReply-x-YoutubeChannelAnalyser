    <style>
        /* =====================================================================
           GLOBAL RESET & CSS VARIABLES
           ===================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Landing Page Variables */
            --font-heading: 'Helvetica Now Display Bold', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-text: #192837;
            --color-accent: #7342E2;
            --color-login-bg: #F2F2EE;

            /* CreatorFlow Studio Variables */
            --bg: #ffffff;
            --text: #0a0a0a;
            --muted: #6b6b6b;
            --button-bg: #0a0a0a;
            --button-text: #ffffff;
            --border-soft: rgba(0, 0, 0, 0.08);
            --green: #17c964;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* Keyframes */
        @keyframes marquee-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        @keyframes line-pulse {
            0% { opacity: 0; transform: scale(1); }
            15% { opacity: 0.9; }
            70% { opacity: 0.4; }
            100% { opacity: 0; transform: scale(0.85); }
        }

        @keyframes unbox-spin {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1600px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(115, 66, 226, 0.3); }
            50% { box-shadow: 0 0 40px rgba(115, 66, 226, 0.7); }
        }

        @keyframes unboxingReel {
            0% { transform: translateX(0); }
            100% { transform: translateX(-600px); }
        }

        @keyframes prizePop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            70% { transform: scale(0.95) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shimmerSlide {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rippleGlow {
            0% { box-shadow: 0 0 0 0 rgba(115, 66, 226, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(115, 66, 226, 0); }
            100% { box-shadow: 0 0 0 0 rgba(115, 66, 226, 0); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(115, 66, 226, 0.2); }
            50% { border-color: rgba(115, 66, 226, 0.6); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            80% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }

        @keyframes spinnerRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes neonBorder {
            0%, 100% { border-color: rgba(0,255,136,0.3); box-shadow: 0 0 8px rgba(0,255,136,0.2); }
            50% { border-color: rgba(0,255,136,0.7); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        }

        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes stagger-link {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #stars-cases-section {
            scroll-margin-top: 100px !important;
        }

        .hero-anim-0 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0s forwards;
        }
        .hero-anim-1 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        }
        .hero-anim-2 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }

        .slide-sheet {
            animation: slide-in-right 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee-left 30s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-links {
                display: none !important;
            }
            .desktop-buttons {
                display: none !important;
            }
            .mobile-toggle {
                display: block !important;
            }
        }

        @media (max-width: 810px) {
            .curved-lines-side {
                display: none !important;
            }
            .curved-lines-top {
                display: flex !important;
            }
            .creatorflow-hero-section {
                min-height: 760px !important;
                padding: 120px 24px 96px !important;
            }
            .creatorflow-hero-bg {
                transform: rotate(90deg) scale(1.6);
            }
            .creatorflow-cta-row {
                flex-direction: column !important;
                width: 100% !important;
                max-width: 320px !important;
            }
            .creatorflow-cta-row > * {
                width: 100% !important;
                justify-content: center !important;
            }
            .trusted-section {
                flex-direction: column !important;
                align-items: flex-start !important;
            }
        }

        @media (min-width: 811px) {
            .curved-lines-top {
                display: none !important;
            }
        }

        /* Shorthand utilities */
        .serif { font-family: 'Source Serif 4', Georgia, serif; }
        .italic { font-style: italic; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 999px;
        }

        /* ==================== MONETIZATION SUITE STYLES ==================== */
        @keyframes tickerSlide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: tickerSlide 35s linear infinite;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }

        @keyframes pulseNeon {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.4), 0 0 20px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 0 18px rgba(0, 255, 136, 0.8), 0 0 35px rgba(0, 255, 136, 0.4); }
        }

        @keyframes duelShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-3deg); }
            40% { transform: translate(4px, -2px) rotate(3deg); }
            60% { transform: translate(-3px, -2px) rotate(-1deg); }
            80% { transform: translate(3px, 2px) rotate(1deg); }
        }
        .duel-box-shake {
            animation: duelShake 0.35s infinite;
        }

        .needle-spin-transition {
            transition: transform 3.8s cubic-bezier(0.12, 0.85, 0.25, 1);
        }

        .scratch-canvas-foil {
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 20px;
        }

        /* Premium hover card effect */
        .premium-card {
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .premium-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 44px rgba(0,0,0,0.12), 0 0 0 1px rgba(115,66,226,0.15);
        }

        /* Shimmer overlay for buttons */
        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmerSlide 2.4s ease-in-out infinite;
            pointer-events: none;
        }

        /* Smooth scroll */
        html { scroll-behavior: smooth; }

        /* Tab enter animation */
        .tab-content-enter {
            animation: cardEntrance 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Neon card outline */
        .neon-card {
            animation: neonBorder 2.5s ease-in-out infinite;
        }

        /* Prize bounce */
        .prize-bounce {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>

        const TelegramGiftMedia = ({ fileId, fileType, icon, name = "", size = "80px", style = {}, forceVector = false }) => {
            const sz = typeof size === 'number' ? `${size}px` : size;
            const numSz = parseInt(size) || 80;

            if (fileId && !forceVector && numSz > 26) {
                const src = `/api/telegram-file/${fileId}`;
                const mergedStyle = { width: sz, height: sz, margin: "0 auto", objectFit: "contain", ...style };
                if (fileType === "video" || (typeof fileId === 'string' && fileId.endsWith('.webm'))) {
                    return <video src={src} autoPlay loop muted playsInline style={mergedStyle}></video>;
                } else if (fileType === "tgs") {
                    return <lottie-player src={src} background="transparent" speed="1" style={mergedStyle} loop autoplay></lottie-player>;
                } else if (fileType === "webp" || fileType === "png" || fileType === "jpg" || fileType === "image") {
                    return <img src={src} style={mergedStyle} alt={name || "Gift"} />;
                }
                return <lottie-player src={src} background="transparent" speed="1" style={mergedStyle} loop autoplay></lottie-player>;
            }

            // High-fidelity Semantic Vector Fallbacks (Zero Unicode Emojis)
            const key = (icon || name || "").toLowerCase();
            const vStyle = numSz <= 28 ? { filter: "none", ...style } : style;
            if (key.includes("cake") || key.includes("🎂")) return <VectorCake size={numSz} style={vStyle} />;

            if (key.includes("champagne") || key.includes("bottle") || key.includes("shampan") || key.includes("🍾")) return <VectorChampagne size={numSz} style={vStyle} />;
            if (key.includes("ring") || key.includes("diamond_ring") || key.includes("uzuk") || key.includes("💍")) return <VectorDiamondRing size={numSz} style={vStyle} />;
            if (key.includes("trophy") || key.includes("kubok") || key.includes("🏆")) return <VectorTrophy size={numSz} style={vStyle} />;
            if (key.includes("rocket") || key.includes("raketa") || key.includes("🚀")) return <VectorRocket size={numSz} style={vStyle} />;
            if (key.includes("cap") || key.includes("kepka") || key.includes("🧢")) return <VectorCap size={numSz} style={vStyle} />;

            if (key.includes("gem") || key.includes("diamond") || key.includes("💎")) return <SvgGem size={Math.round(numSz * 0.8)} color="#00f0ff" style={vStyle} />;
            if (key.includes("clapper") || key.includes("video")) return <SvgClapperboard size={Math.round(numSz * 0.8)} color="#7342E2" style={vStyle} />;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.04);
                } catch(e) {}
            };

                        const gain = ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.09);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.5);
                        osc.connect(gain);

                grad.addColorStop(0, '#bdc3c7');
                grad.addColorStop(0.3, '#7f8c8d');
                grad.addColorStop(0.7, '#95a5a6');
                grad.addColorStop(1, '#bdc3c7');
                ctx.fillStyle = grad;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                if (!clientX || !clientY) return;
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 26, 0, Math.PI * 2);

                    if (d.ok) {
                        setOtpStep(2);
                        setOtpCooldown(30);
                        setAuthSuccessMsg("Tasdiqlash kodi Telegram botingizga yuborildi!");
                    } else {
                        setAuthError(d.error || "Kod yuborilmadi");
                    }
                })
                .catch(err => {
                    setOtpLoading(false);
                    setAuthError("Tarmoq xatosi: " + err);
                });
            };

            const handleVerifyOtp = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                const num = parseInt(loginIdInput);
                const code = otpInput.trim();
                if (!num || !code || code.length < 6) {
                    setAuthError("Iltimos, 6-raqamli tasdiqlash kodini to'liq kiriting!");
                    return;
                }
                setOtpLoading(true);
                setAuthError('');
                fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tg_user_id: num, otp: code })
                })
                .then(r => r.json())
                .then(d => {
                    setOtpLoading(false);
                    if (d.ok) {
                        localStorage.setItem('creatorflow_auth_token', d.token);
                        localStorage.setItem('creatorflow_tg_user_id', num);
                        setTgUser(prev => ({
                            ...prev,
                            id: num,
                            first_name: `Creator #${num}`,
                            is_vip: d.is_vip || false,
                            is_owner: d.is_owner || false
                        }));
                        setShowLoginModal(false);
                        setView('dashboard');
                        setOtpStep(1);
                        setOtpInput('');
                        loadStudioStats(num);
                        loadChannels(num);
                        loadUserStats(num, true);
                    } else {
                        setAuthError(d.error || "Kod noto'g'ri yoki muddati o'tgan!");
                    }
                })
                .catch(err => {
                    setOtpLoading(false);
                    setAuthError("Tarmoq xatosi: " + err);
                });

            const handleLogout = () => {
                localStorage.removeItem('creatorflow_auth_token');
                localStorage.removeItem('creatorflow_tg_user_id');
                setTgUser({ id: 0, first_name: "Guest Creator", username: "", photo_url: null, is_vip: false, is_owner: false });
                setUserStats({ balance_uzs: 0, ton_balance: 0, is_vip: false, is_owner: false });
                setOtpStep(1);
                setOtpInput('');
                setAuthError('');
                setAuthSuccessMsg('');
                setView('login');
            };

            const loadUserStats = (uid, forceRefresh = false) => {
                const targetUid = uid || tgUser.id;
                if (!targetUid) return;
                fetch(`/api/bot_user?tg_user_id=${targetUid}${forceRefresh ? '&refresh=1' : ''}`)
                    .then(r => r.json())
                    .then(d => {
                        if (d && (d.ok || d.balance_uzs !== undefined)) {
                            setUserStats({
                                balance_uzs: d.balance_uzs || 0,
                                ton_balance: d.ton_balance || 0,
                                is_vip: d.is_vip || false,
                                is_owner: d.is_owner || false
                            });

                                ...prev,
                                id: targetUid,
                                first_name: d.first_name || prev.first_name || `Creator #${targetUid}`,
                                last_name: d.last_name || prev.last_name || '',
                                username: d.username || prev.username || '',
                                photo_url: d.photo_url || prev.photo_url || null,
                                photo_file_id: d.photo_file_id || prev.photo_file_id || null,
                                is_vip: d.is_vip || false,
                                is_owner: d.is_owner || false

                                setTimeout(() => setSyncSuccessToast(false), 2500);

                    .catch(() => {});

            const loadStudioStats = (uid) => {
                const targetUid = uid || tgUser.id;
                if (!targetUid) return;
                fetch(`/api/stats?tg_user_id=${targetUid}`)
                    .then(r => r.json())
                    .then(d => {
                        if (d && (d.ok || d.total_videos !== undefined)) {

                    })

            const loadChannels = (uid) => {

                    .then(r => r.json())

            const searchVideos = (q) => {

                setFeedLoading(true);
                fetch(`/api/videos?q=${encodeURIComponent(query)}&type=&maxResults=16`)
                    .then(r => r.json())
                    .then(d => {
                        setFeedVideos(d.videos || []);
                        setFeedLoading(false);
                    })
                    .catch(() => setFeedLoading(false));
            };

            const loadTrending = (region) => {

                fetch(`/api/trending?region=${region}`)
                    .then(r => r.json())

                    .then(r => r.json())
                    .then(d => {
                        setSelectedFormatsVideo({ id: video.id, title: video.title, formats: d.formats || [] });

            const startDownload = (videoId, res) => {

                const iframe = document.createElement('iframe');

                document.body.appendChild(iframe);
                setTimeout(() => {

            useEffect(() => {
                setAvatarImgError(false);

            useEffect(() => {
                // Initialize Telegram WebApp, 1-Click OTP URL params, or verified session token
                let initHandled = false;

                // 1. One-click URL params (?tg_user_id=...&otp=...)
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const qId = parseInt(urlParams.get('tg_user_id') || urlParams.get('user_id') || '0');
                    const qOtp = urlParams.get('otp');
                    if (qId > 0 && qOtp) {
                        initHandled = true;
                        fetch('/api/auth/verify-otp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ tg_user_id: qId, otp: qOtp })

                        .then(d => {
                            if (d.ok) {

                        fetch('/api/auth/verify-webapp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ initData: tg.initData })

                        .then(r => r.json())

                                localStorage.setItem('creatorflow_auth_token', d.token);
                                localStorage.setItem('creatorflow_tg_user_id', uid);

                                setTgUser(prev => ({
                                    ...prev,
                                    id: uid,
                                    first_name: u.first_name || `Creator #${uid}`,
                                    last_name: u.last_name || '',

                                    is_owner: d.is_owner

                                setView('dashboard');
                                loadStudioStats(uid);
                                loadChannels(uid);
                                loadUserStats(uid, true);
                            } else {
                                setView('login');
                            }
                        })
                        .catch(() => setView('login'));
                    }
                }

                // 3. Saved localStorage session with token verification
                if (!initHandled) {
                    const savedToken = localStorage.getItem('creatorflow_auth_token');
                    const savedUid = parseInt(localStorage.getItem('creatorflow_tg_user_id') || '0');
                    if (savedToken && savedUid > 0) {
                        fetch('/api/auth/verify-token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: savedToken, tg_user_id: savedUid })
                        })
                        .then(r => r.json())
                        .then(d => {
                            if (d.ok) {
                                setView('dashboard');
                                setTgUser(prev => ({ ...prev, id: savedUid, first_name: `Creator #${savedUid}`, is_vip: d.is_vip || false, is_owner: d.is_owner || false }));

                                loadChannels(savedUid);
                                loadUserStats(savedUid, true);
                            } else {
                                localStorage.removeItem('creatorflow_auth_token');
                                localStorage.removeItem('creatorflow_tg_user_id');
                                setView('login');
                            }
                        })
                        .catch(() => setView('login'));
                    } else {
                        setView('login');
                    }
                }

                            { id: "tier_3", name: "Gold Pro Studio Case", price_stars: 250, icon: "package", color: "#ffd700", badge: "250 Stars", drops: [{ stars: 100, name: "Champagne Bottle", rarity: "common", icon: "champagne", is_nft: false }, { stars: 250, name: "Diamond Ring", rarity: "rare", icon: "diamond_ring", is_nft: false }, { stars: 500, name: "Golden Trophy", rarity: "legendary", icon: "trophy", is_nft: false }] },
                            { id: "tier_4", name: "Platinum VIP Master Case", price_stars: 750, icon: "package", color: "#00f0ff", badge: "750 Stars", drops: [{ stars: 500, name: "Golden Trophy", rarity: "common", icon: "trophy", is_nft: false }, { stars: 1000, name: "Space Rocket", rarity: "rare", icon: "rocket", is_nft: false }, { stars: 1000, name: "Black Cap Collectible", rarity: "legendary", icon: "cap", is_nft: true }] },
                            { id: "tier_5", name: "Diamond Galaxy Case", price_stars: 2500, icon: "package", color: "#b026ff", badge: "2,500 Stars", drops: [{ stars: 1000, name: "Space Rocket", rarity: "common", icon: "rocket", is_nft: false }, { stars: 1500, name: "Plush Collectible", rarity: "rare", icon: "plush", is_nft: true }, { stars: 5000, name: "Royal Crown Collectible", rarity: "legendary", icon: "crown", is_nft: true }] },
                        ]);
                    });

                fetchRecentDrops();
                fetchBattles();
                fetchDailyStreak();
                initScratchCard();

                const timer = setInterval(() => {
                    fetchRecentDrops();
                    fetchBattles();
                }, 14000);
                return () => clearInterval(timer);
            }, []);

            // Trigger Stars Mystery Case Opening (Strictly Authenticated)
            const handleOpenCase = (c) => {
                if (!tgUser || !tgUser.id || tgUser.id <= 0) {
                    setShowLoginModal(true);
                    return;
                }
                setActiveUnboxing(c);
                setIsRolling(true);
                setUnboxingPrize(null);

                const tickTimer = setInterval(playTickSound, 120);

                // Call backend API for real unboxing result
                fetch('/api/stars/open-case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: tgUser.id, tier_id: c.id })
                })
                .then(r => r.json())
                .then(data => {
                    setTimeout(() => {
                        clearInterval(tickTimer);
                        setIsRolling(false);
                        if (data.ok) {
                            setUnboxingPrize(data);
                            setUserGifts(prev => [{ ...data, date: "Hozir" }, ...prev]);
                            playWinFanfare();
                            if (window.confetti) {
                                window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                            }
                        } else {
                            setActiveUnboxing(null);
                            alert(data.error || "Xatolik: Hisobingizda Stars yetarli emas yoki sovg'ani ochib bo'lmadi.");
                        }
                    }, 2800);
                })
                .catch(() => {
                    clearInterval(tickTimer);
                    setIsRolling(false);
                    setActiveUnboxing(null);
                    alert("Tarmoq xatosi: Server bilan aloqa o'rnatilmadi.");
                });
            };

            // Trigger Case Opening with UZS (So'm Balansi orqali)
            const handleOpenCaseUzs = (c) => {
                if (!tgUser || !tgUser.id || tgUser.id <= 0) {
                    setShowLoginModal(true);
                    return;
                }
                const priceUzs = c.price_uzs || (c.price_stars * 400);
                const currentBal = (userStats && userStats.balance_uzs) || 0;
                if (currentBal < priceUzs) {
                    alert(`Balansingiz yetarli emas!\n\nKeys narxi: ${priceUzs.toLocaleString()} so'm\nSizning balansingiz: ${currentBal.toLocaleString()} so'm\n\nIltimos, avval bot orqali balansingizni to'ldiring.`);
                    return;

                setActiveUnboxing(c);
                setIsRolling(true);
                setUnboxingPrize(null);

                const tickTimer = setInterval(playTickSound, 120);

                // Call backend API for real UZS unboxing
                fetch('/api/stars/open-case-uzs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: tgUser.id, tier_id: c.id })
                })
                .then(r => r.json())
                .then(data => {
                    setTimeout(() => {
                        clearInterval(tickTimer);
                        setIsRolling(false);
                        if (data.ok) {
                            setUnboxingPrize(data);
                            setUserGifts(prev => [{ ...data, date: "Hozir" }, ...prev]);
                            playWinFanfare();
                            if (window.confetti) {
                                window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

                            if (data.new_balance !== undefined) {

                            setActiveUnboxing(null);
                            alert(data.error || "Xatolik: Balansingiz yetarli emas yoki sovg'ani ochib bo'lmadi.");
                        }
                    }, 2800);
                })
                .catch(() => {
                    clearInterval(tickTimer);
                    setIsRolling(false);
                    setActiveUnboxing(null);
                    alert("Tarmoq xatosi: Server bilan aloqa o'rnatilmadi.");
                });
            };

            // Trigger Telegram Stars Payment Invoice
            const handleBuyInvoice = (c) => {
                if (!tgUser || !tgUser.id || tgUser.id <= 0) {
                    setShowLoginModal(true);
                    return;

                    headers: { 'Content-Type': 'application/json' },

                    {view === 'login' && (

                        }}>

                            <div style={{

                                top: "-10%",
                                left: "50%",
                                transform: "translateX(-50%)",

                            {/* Top Navbar */}
                            <nav style={{

                                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>

                                    <span style={{ fontSize: "12px", color: "rgba(255,255,255,0.7)", fontWeight: 600 }}>Telegram Bot Online</span>
                                </div>

                            <div style={{
                                position: "relative",
                                zIndex: 10,
                                maxWidth: "520px",
                                width: "100%",
                                margin: "20px auto 40px",
                                padding: "0 24px",
                                textAlign: "center"
                            }}>
                                <div style={{
                                    background: "rgba(255, 255, 255, 0.03)",
                                    backdropFilter: "blur(24px)",
                                    WebkitBackdropFilter: "blur(24px)",
                                    border: "1px solid rgba(255, 255, 255, 0.08)",
                                    borderRadius: "28px",
                                    padding: "40px 32px",
                                    boxShadow: "0 24px 64px rgba(0,0,0,0.6)"

                                    <h1 style={{

                                    {otpStep === 1 ? (
