<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreatorFlow Studio | Creative AI & Telegram Stars Suite</title>
    <meta name="description" content="Premium creative suite, Telegram Stars mystery cases, and automated YouTube channel analytics studio.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://db.onlinewebfonts.com/c/04e6981992c0e2e7642af2074ebe3901?family=Helvetica+Now+Display+Bold" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&family=Cedarville+Cursive&display=swap" rel="stylesheet">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- React 18 & Babel for standalone JSX execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Canvas Confetti for Mystery Case Unboxing -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* =====================================================================
           GLOBAL RESET & CSS VARIABLES
           ===================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Landing Page Variables */
            --font-heading: 'Helvetica Now Display Bold', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-text: #192837;
            --color-accent: #7342E2;
            --color-login-bg: #F2F2EE;

            /* Alwayzz Studio Variables */
            --bg: #ffffff;
            --text: #0a0a0a;
            --muted: #6b6b6b;
            --button-bg: #0a0a0a;
            --button-text: #ffffff;
            --border-soft: rgba(0, 0, 0, 0.08);
            --green: #17c964;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* Keyframes */
        @keyframes marquee-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        @keyframes line-pulse {
            0% { opacity: 0; transform: scale(1); }
            15% { opacity: 0.9; }
            70% { opacity: 0.4; }
            100% { opacity: 0; transform: scale(0.85); }
        }

        @keyframes unbox-spin {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1600px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(115, 66, 226, 0.3); }
            50% { box-shadow: 0 0 40px rgba(115, 66, 226, 0.7); }
        }

        @keyframes unboxingReel {
            0% { transform: translateX(0); }
            100% { transform: translateX(-600px); }
        }

        @keyframes prizePop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            70% { transform: scale(0.95) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shimmerSlide {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rippleGlow {
            0% { box-shadow: 0 0 0 0 rgba(115, 66, 226, 0.4); }
            70% { box-shadow: 0 0 0 14px rgba(115, 66, 226, 0); }
            100% { box-shadow: 0 0 0 0 rgba(115, 66, 226, 0); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(115, 66, 226, 0.2); }
            50% { border-color: rgba(115, 66, 226, 0.6); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.08); opacity: 1; }
            80% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }

        @keyframes spinnerRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes neonBorder {
            0%, 100% { border-color: rgba(0,255,136,0.3); box-shadow: 0 0 8px rgba(0,255,136,0.2); }
            50% { border-color: rgba(0,255,136,0.7); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        }

        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes stagger-link {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .hero-anim-0 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0s forwards;
        }
        .hero-anim-1 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        }
        .hero-anim-2 {
            opacity: 0;
            animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }

        .slide-sheet {
            animation: slide-in-right 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee-left 30s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-links {
                display: none !important;
            }
            .desktop-buttons {
                display: none !important;
            }
            .mobile-toggle {
                display: block !important;
            }
        }

        @media (max-width: 810px) {
            .curved-lines-side {
                display: none !important;
            }
            .curved-lines-top {
                display: flex !important;
            }
            .alwayzz-hero-section {
                min-height: 760px !important;
                padding: 120px 24px 96px !important;
            }
            .alwayzz-hero-bg {
                transform: rotate(90deg) scale(1.6);
            }
            .alwayzz-cta-row {
                flex-direction: column !important;
                width: 100% !important;
                max-width: 320px !important;
            }
            .alwayzz-cta-row > * {
                width: 100% !important;
                justify-content: center !important;
            }
            .trusted-section {
                flex-direction: column !important;
                align-items: flex-start !important;
            }
        }

        @media (min-width: 811px) {
            .curved-lines-top {
                display: none !important;
            }
        }

        /* Shorthand utilities */
        .serif { font-family: 'Source Serif 4', Georgia, serif; }
        .italic { font-style: italic; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 999px;
        }

        /* ==================== MONETIZATION SUITE STYLES ==================== */
        @keyframes tickerSlide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: tickerSlide 35s linear infinite;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }

        @keyframes pulseNeon {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.4), 0 0 20px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 0 18px rgba(0, 255, 136, 0.8), 0 0 35px rgba(0, 255, 136, 0.4); }
        }

        @keyframes duelShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-3deg); }
            40% { transform: translate(4px, -2px) rotate(3deg); }
            60% { transform: translate(-3px, -2px) rotate(-1deg); }
            80% { transform: translate(3px, 2px) rotate(1deg); }
        }
        .duel-box-shake {
            animation: duelShake 0.35s infinite;
        }

        .needle-spin-transition {
            transition: transform 3.8s cubic-bezier(0.12, 0.85, 0.25, 1);
        }

        .scratch-canvas-foil {
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 20px;
        }

        /* Premium hover card effect */
        .premium-card {
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .premium-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 44px rgba(0,0,0,0.12), 0 0 0 1px rgba(115,66,226,0.15);
        }

        /* Shimmer overlay for buttons */
        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmerSlide 2.4s ease-in-out infinite;
            pointer-events: none;
        }

        /* Smooth scroll */
        html { scroll-behavior: smooth; }

        /* Tab enter animation */
        .tab-content-enter {
            animation: cardEntrance 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Neon card outline */
        .neon-card {
            animation: neonBorder 2.5s ease-in-out infinite;
        }

        /* Prize bounce */
        .prize-bounce {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==================== INLINE ICONS ====================
        const SvgLogo = ({ size = 32, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 256 256" fill="none" style={{ flexShrink: 0 }}>
                <path
                    d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z"
                    fill={color}
                />
            </svg>
        );

        const ZapIcon = ({ size = 24, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ display: "inline", verticalAlign: "middle", position: "relative", top: "-2px", margin: "0 4px" }}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill={color} />
            </svg>
        );

        const LockIcon = ({ size = 24, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ display: "inline", verticalAlign: "middle", position: "relative", top: "-2px", margin: "0 4px" }}>
                <circle cx="12" cy="16" r="1" fill={color} />
                <rect x="3" y="10" width="18" height="12" rx="2" />
                <path d="M7 10V7a5 5 0 0 1 10 0v3" />
            </svg>
        );

        const FingerprintIcon = ({ size = 24, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ display: "inline", verticalAlign: "middle", position: "relative", top: "-2px", marginLeft: "6px" }}>
                <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4" />
                <path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2" />
                <path d="M17.29 21.02c.12-.6.18-1.2.18-1.8 0-4.42-3.58-8-8-8-.76 0-1.49.11-2.18.3" />
                <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
                <path d="M8.65 22c.21-.66.45-1.32.75-2" />
                <path d="M14 13.12c0 2.38 0 4.88-.32 6.88" />
                <path d="M2 16h.01" />
                <path d="M21.8 16c.2-2 .2-4 .2-4 0-2.48-.84-4.75-2.25-6.5" />
            </svg>
        );

        const ArrowRightCircleIcon = ({ size = 20, color = "#ffffff" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 16 16 12 12 8" />
                <line x1="8" y1="12" x2="16" y2="12" />
            </svg>
        );

        const ChevronUpIcon = ({ size = 16, color = "#ffffff" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="18 15 12 9 6 15" />
            </svg>
        );

        const MenuIcon = ({ size = 24, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="6" x2="20" y2="6" />
                <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
        );

        const XIcon = ({ size = 20, color = "#192837" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        );

        // ==================== MAIN APPLICATION ====================
        function App() {
            // View state: 'landing' (Hero Section Password Manager) vs 'dashboard' (Alwayzz Studio Mode)
            const [view, setView] = useState('landing');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('cases'); // 'cases' | 'analytics' | 'videos' | 'kyc'
            const [drawerOpen, setDrawerOpen] = useState(false);

            // Telegram user context
            const [tgUser, setTgUser] = useState({ id: 0, first_name: "Guest Creator", username: "" });
            const [starsCases, setStarsCases] = useState([]);
            const [activeUnboxing, setActiveUnboxing] = useState(null); // case being opened
            const [unboxingPrize, setUnboxingPrize] = useState(null);
            const [isRolling, setIsRolling] = useState(false);
            const [oddsModalCase, setOddsModalCase] = useState(null);
            const [userGifts, setUserGifts] = useState([
                { prize_name: "Delicious Cake", prize_stars: 15, rarity: "common", icon: "🎂", date: "Bugun" },
                { prize_name: "Bouquet of Flowers", prize_stars: 50, rarity: "rare", icon: "💐", date: "Bugun" },
                { prize_name: "Durov's Black Cap NFT", prize_stars: 1000, rarity: "legendary", icon: "🧢", is_nft: true, serial_no: "#749", date: "Kecha" }
            ]);

            // ==================== 6 MONETIZATION SUITE STATES ====================
            const [starsSubTab, setStarsSubTab] = useState('cases'); // 'cases' | 'battles' | 'upgrader' | 'streak' | 'scratch' | 'redeem'
            const [recentDrops, setRecentDrops] = useState([]);
            
            // PvP Battles
            const [caseBattles, setCaseBattles] = useState([]);
            const [activeBattle, setActiveBattle] = useState(null);
            const [isBattleRolling, setIsBattleRolling] = useState(false);
            const [battleWinner, setBattleWinner] = useState(null);
            
            // Upgrader (Zero-Loss Protected)
            const [upgraderItem, setUpgraderItem] = useState({ name: "Delicious Cake", stars: 15, icon: "🎂" });
            const [upgraderTarget, setUpgraderTarget] = useState({ name: "Champagne Bottle", stars: 100, icon: "🍾" });
            const [upgraderAngle, setUpgraderAngle] = useState(0);
            const [isUpgrading, setIsUpgrading] = useState(false);
            const [upgradeResult, setUpgradeResult] = useState(null);
            
            // Daily Streak (Faqat raqamli xizmatlar)
            const [streakData, setStreakData] = useState(null);
            const [streakClaimedModal, setStreakClaimedModal] = useState(null);
            
            // Scratch Cards
            const [scratchData, setScratchData] = useState({ won: false, symbols: ["🎬", "🎬", "⚡"], prize: null });
            const [scratchFoilCleared, setScratchFoilCleared] = useState(false);
            const [isScratching, setIsScratching] = useState(false);
            const scratchCanvasRef = useRef(null);
            
            // Creator Store Redeem
            const [redeemModal, setRedeemModal] = useState(null);

            // Web Audio sound generator for authentic unboxing experience
            const playTickSound = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.04);
                } catch(e) {}
            };

            const playWinFanfare = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.09);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.5);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.09);
                        osc.stop(ctx.currentTime + i * 0.09 + 0.5);
                    });
                } catch(e) {}
            };

            // Fetch Recent Drops for Marquee
            const fetchRecentDrops = () => {
                fetch('/api/stars/recent-drops')
                    .then(r => r.json())
                    .then(data => {
                        if (data.ok && data.drops) setRecentDrops(data.drops);
                    })
                    .catch(() => {});
            };

            // Fetch PvP Battles
            const fetchBattles = () => {
                fetch('/api/stars/pvp-battles')
                    .then(r => r.json())
                    .then(data => {
                        if (data.ok && data.battles) setCaseBattles(data.battles);
                    })
                    .catch(() => {});
            };

            const handleCreateBattle = (tierId) => {
                const uName = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || "Creator");
                fetch('/api/stars/pvp-battle/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: tgUser.id || 0, user_name: uName, tier_id: tierId })
                })
                .then(r => r.json())
                .then(res => {
                    if (res.ok) {
                        fetchBattles();
                        alert("Yangi PvP jang yaratildi! Boshqa o'yinchi qo'shilishini kuting yoki unga kiring.");
                    }
                })
                .catch(err => alert("Jang yaratishda xatolik: " + err));
            };

            const handleJoinBattle = (b) => {
                const uName = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || "You");
                setActiveBattle(b);
                setIsBattleRolling(true);
                setBattleWinner(null);
                const tickTimer = setInterval(playTickSound, 120);

                fetch('/api/stars/pvp-battle/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ battle_id: b.id, user_id: tgUser.id || 0, user_name: uName })
                })
                .then(r => r.json())
                .then(res => {
                    setTimeout(() => {
                        clearInterval(tickTimer);
                        setIsBattleRolling(false);
                        if (res.ok) {
                            setActiveBattle(res.battle);
                            setBattleWinner(res.battle.winner_name);
                            playWinFanfare();
                            if (window.confetti) window.confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
                            fetchBattles();
                            fetchRecentDrops();
                        } else {
                            alert(res.error || "Jangga qo'shilishda xatolik!");
                            setActiveBattle(null);
                        }
                    }, 3200);
                })
                .catch(err => {
                    clearInterval(tickTimer);
                    setIsBattleRolling(false);
                    alert("Aloqa xatosi: " + err);
                    setActiveBattle(null);
                });
            };

            // Controlled Upgrader Run
            const handleRunUpgrade = () => {
                if (isUpgrading) return;
                setIsUpgrading(true);
                setUpgradeResult(null);

                fetch('/api/stars/upgrader', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: tgUser.id || 0,
                        item_stars: upgraderItem.stars,
                        target_stars: upgraderTarget.stars,
                        target_name: upgraderTarget.name,
                        target_icon: upgraderTarget.icon
                    })
                })
                .then(r => r.json())
                .then(res => {
                    if (res.ok) {
                        const tickTimer = setInterval(playTickSound, 100);
                        const spins = 1800; // 5 full turns
                        const targetAngle = upgraderAngle + spins + res.final_angle;
                        setUpgraderAngle(targetAngle);

                        setTimeout(() => {
                            clearInterval(tickTimer);

                                            width: "100%",
                                            color: "var(--text)",
                                            boxShadow: "0 24px 64px rgba(0,0,0,0.25)"
                                        }}>
                                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "20px" }}>
                                                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                                    <span style={{ fontSize: "32px" }}>{oddsModalCase.icon}</span>
                                                    <div>
                                                        <h3 style={{ fontSize: "18px", fontWeight: 700 }}>{oddsModalCase.name}</h3>
                                                        <span style={{ fontSize: "12px", color: "var(--muted)" }}>Narxi: {oddsModalCase.price_stars} ⭐ Stars</span>
                                                    </div>
                                                </div>
                                                <button onClick={() => setOddsModalCase(null)} style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: "18px", fontWeight: 700 }}>✕</button>
                                            </div>

                                            <div style={{ background: "#f8f8fa", borderRadius: "16px", padding: "16px", marginBottom: "20px" }}>
                                                <div style={{ fontSize: "13px", fontWeight: 700, color: "var(--text)", marginBottom: "8px" }}>
                                                    Ehtimollar Jadvali (House Edge):
                                                </div>
                                                <div style={{ display: "flex", flexDirection: "column", gap: "8px", fontSize: "13px" }}>
                                                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                                                        <span>⚪ Oddiy sovg'a (Common):</span>
                                                        <b>70%</b>
                                                    </div>
                                                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                                                        <span>🟣 Noyob sovg'a (Rare):</span>
                                                        <b>25%</b>
                                                    </div>
                                                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                                                        <span>👑 Afsonaviy NFT (Legendary Jackpot):</span>
                                                        <b style={{ color: "#ffd700" }}>5%</b>
                                                    </div>
                                                </div>
                                            </div>

                                            <div style={{ display: "flex", flexDirection: "column", gap: "10px", marginBottom: "24px" }}>
                                                <div style={{ fontSize: "13px", fontWeight: 700 }}>Mumkin bo'lgan sovg'alar:</div>
                                                {oddsModalCase.drops.map((d, i) => (
                                                    <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", background: "#ffffff", border: "1px solid var(--border-soft)", borderRadius: "12px" }}>
                                                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                                            <span style={{ fontSize: "24px" }}>{d.icon}</span>
                                                            <span style={{ fontSize: "13px", fontWeight: 600 }}>{d.name}</span>
                                                        </div>
                                                        <span style={{ fontSize: "13px", fontWeight: 700, color: "#ffd700" }}>{d.stars} ⭐</span>
                                                    </div>
                                                ))}
                                            </div>

                                            <button
                                                onClick={() => { const c = oddsModalCase; setOddsModalCase(null); handleBuyInvoice(c); }}
                                                style={{ width: "100%", padding: "14px 0", borderRadius: "999px", background: oddsModalCase.color || "#7342E2", color: "#ffffff", border: "none", fontWeight: 700, cursor: "pointer" }}
                                            >
                                                Keysni Ochish ({oddsModalCase.price_stars} ⭐)
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Single Unboxing Modal (Existing CS:GO Reel) */}
                                {activeUnboxing && (
                                    <div style={{
                                        position: "fixed",
                                        inset: 0,
                                        zIndex: 999999,
                                        background: "rgba(5, 5, 10, 0.88)",
                                        backdropFilter: "blur(12px)",
                                        display: "flex",
                                        alignItems: "center",
                                        justifyContent: "center",
                                        padding: "20px"
                                    }}>
                                        <div style={{
                                            background: "linear-gradient(135deg, #13141f 0%, #1c1d2d 100%)",
                                            borderRadius: "32px",
                                            padding: "36px",
                                            maxWidth: "540px",
                                            width: "100%",
                                            color: "#ffffff",
                                            textAlign: "center",
                                            boxShadow: "0 24px 64px rgba(0,0,0,0.5)",
                                            border: "1px solid rgba(255,255,255,0.1)",
                                            position: "relative",
                                            overflow: "hidden"
                                        }}>
                                            <div style={{ fontSize: "13px", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#7342E2", marginBottom: "8px" }}>
                                                {activeUnboxing.name}
                                            </div>
                                            <h3 style={{ fontSize: "24px", fontWeight: 700, marginBottom: "28px" }}>
                                                {isRolling ? "Sovg'a aniqlanmoqda..." : "Yutuq Qabul Qilindi!"}
                                            </h3>

                                            {/* Center Reel Display */}
                                            <div style={{
                                                position: "relative",
                                                height: "170px",
                                                background: "rgba(0,0,0,0.4)",
                                                borderRadius: "20px",
                                                border: "1px solid rgba(255,255,255,0.1)",
                                                display: "flex",
                                                alignItems: "center",
                                                justifyContent: "center",
                                                overflow: "hidden",
                                                marginBottom: "28px"
                                            }}>
                                                {isRolling ? (
                                                    <div style={{
                                                        display: "flex",
                                                        gap: "36px",
                                                        alignItems: "center",
                                                        animation: "unboxingReel 0.2s linear infinite"
                                                    }}>
                                                        {[...Array(8)].map((_, rIdx) => {
                                                            const item = activeUnboxing.drops[rIdx % activeUnboxing.drops.length];
                                                            return (
                                                                <div key={rIdx} style={{ textAlign: "center", flexShrink: 0 }}>
                                                                    <div style={{ fontSize: "52px" }}>{item.icon}</div>
                                                                    <div style={{ fontSize: "12px", color: "#bbb", marginTop: "4px" }}>{item.name}</div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <div style={{ animation: "prizePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)" }}>
                                                        <div style={{ fontSize: "72px", filter: "drop-shadow(0 0 20px rgba(255,215,0,0.5))" }}>
                                                            {unboxingPrize ? unboxingPrize.icon : activeUnboxing.drops[0].icon}
                                                        </div>
                                                        <div style={{ fontSize: "20px", fontWeight: 800, marginTop: "8px", color: "#ffffff" }}>
                                                            {unboxingPrize ? unboxingPrize.prize_name : activeUnboxing.drops[0].name}
                                                        </div>
                                                        <div style={{ fontSize: "18px", fontWeight: 700, color: "#ffd700", marginTop: "4px" }}>
                                                            {unboxingPrize ? `${unboxingPrize.prize_stars} ⭐ Stars` : ""}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Winner Details */}
                                            {!isRolling && unboxingPrize && (
                                                <div style={{ marginBottom: "24px", background: unboxingPrize.is_nft ? "linear-gradient(135deg, rgba(255,215,0,0.15), rgba(115,66,226,0.2))" : "rgba(255,215,0,0.1)", padding: "16px", borderRadius: "16px", border: `1px solid ${unboxingPrize.is_nft ? 'rgba(115,66,226,0.5)' : 'rgba(255,215,0,0.3)'}` }}>
                                                    <div style={{ fontSize: "13px", color: unboxingPrize.is_nft ? "#00f0ff" : "#ffd700", fontWeight: 700, textTransform: "uppercase" }}>
                                                        {unboxingPrize.is_nft ? "👑 AFSONAVIY TON NFT QO'LGA KIRITILDI!" : "🎉 YUTUQ QO'LGA KIRITILDI!"}
                                                    </div>
                                                    <div style={{ fontSize: "18px", fontWeight: 700, margin: "6px 0" }}>
                                                        {unboxingPrize.prize_name}
                                                    </div>
                                                    {unboxingPrize.is_nft && unboxingPrize.serial_no && (
                                                        <div style={{ fontSize: "12px", color: "#ffd700", fontWeight: 600, margin: "4px 0" }}>
                                                            Nusxa: {unboxingPrize.serial_no} • Fragment.com Ready
                                                        </div>
                                                    )}
                                                    <div style={{ fontSize: "13px", color: "#aaa" }}>
                                                        {unboxingPrize.is_nft ? "NFT profilingizga biriktirildi va TON tarmog'iga chiqarishga tayyor!" : "Sovg'a sizning Telegram profilingiz vitrinasiga kiritildi!"}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Action Buttons */}
                                            <div style={{ display: "flex", gap: "12px" }}>
                                                <button
                                                    onClick={() => handleOpenCase(activeUnboxing)}
                                                    disabled={isRolling}
                                                    style={{
                                                        flex: 1,
                                                        padding: "14px 0",
                                                        borderRadius: "999px",
                                                        background: "#7342E2",
                                                        color: "#ffffff",
                                                        fontWeight: 700,
                                                        border: "none",
                                                        cursor: isRolling ? "not-allowed" : "pointer",
                                                        opacity: isRolling ? 0.6 : 1
                                                    }}
                                                >
                                                    🔁 Yana Ochish ({activeUnboxing.price_stars} ⭐)
                                                </button>
                                                <button
                                                    onClick={() => { setActiveUnboxing(null); setUnboxingPrize(null); }}
                                                    style={{
                                                        padding: "14px 24px",
                                                        borderRadius: "999px",
                                                        background: "rgba(255,255,255,0.1)",
                                                        color: "#ffffff",
                                                        fontWeight: 600,
                                                        border: "none",
                                                        cursor: "pointer"
                                                    }}
                                                >
                                                    Yopish
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </section>

                            {/* Footer */}
                            <footer style={{ borderTop: "1px solid var(--border-soft)", padding: "48px 24px", textAlign: "center", color: "var(--muted)", fontSize: "14px" }}>
                                <div style={{ display: "flex", justifyContent: "center", alignItems: "baseline", gap: "4px", marginBottom: "8px" }}>
                                    <span className="serif italic" style={{ fontSize: "20px", fontWeight: 600, color: "var(--text)" }}>Alwayzz</span>
                                    <sup style={{ fontWeight: 600 }}>®</sup>
                                    <span style={{ margin: "0 8px" }}>•</span>
                                    <span style={{ color: "var(--text)", fontWeight: 600 }}>CreatorFlow Studio</span>
                                </div>
                                <p>© {new Date().getFullYear()} CreatorFlow Studio. Barcha huquqlar himoyalangan.</p>
                            </footer>
                        </div>
                    )}
                </div>
            );
        }

        // Render root
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
